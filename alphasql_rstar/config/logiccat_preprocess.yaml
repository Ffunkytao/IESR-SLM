# MySQL preprocessing config for logiccat dataset
# Edit paths and thresholds as needed.

data_file_path: "data/logiccat/IeSlMRM_dev.json"  # 使用前400条数据测试
save_root_dir: "data/preprocessed/IeSlMRM_dev"
split: "dev"

# LSH / retrieval params
lsh_threshold: 0.5
lsh_signature_size: 128
lsh_n_gram: 3
lsh_top_k: 20
edit_similarity_threshold: 0.3
embedding_similarity_threshold: 0.6
n_parallel_processes: 8
max_dataset_samples: -1

# LLM options (set use_local_model false if you want to call OpenAI-compatible API via call_openai)
use_local_model: true
local_model_path: ""  # 通过环境变量 LLM_PATH 设置，或在此处指定本地模型路径
local_model_device: "cuda:0"
model_name: "Qwen/Qwen2.5-Coder-7B-Instruct"
temperature: 0.7

# MySQL connection (从环境变量读取，请通过环境变量设置数据库连接信息)
# 注意：不要在此文件中硬编码数据库连接信息
mysql:
  host: ""  # 通过环境变量 MYSQL_HOST 设置
  port: 3306  # 通过环境变量 MYSQL_PORT 设置
  user: "root"  # 通过环境变量 MYSQL_USER 设置
  password: ""  # 通过环境变量 MYSQL_PASSWORD 设置
  # database: ""  # optional default; per-task db_id overrides

